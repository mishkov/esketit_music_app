name: Code quality checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Dart analyzer
        run: dart analyze .

      - name: Run Flutter analyzer
        run: flutter analyze --no-pub .

      - name: Run tests
        run: flutter test --no-pub

  build:
    name: Build ${{ matrix.platform }}
    needs: quality
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            runner: ubuntu-latest
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Configure Apple builds
        if: runner.os == 'macOS'
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web
        if: matrix.platform == 'web'
        run: flutter build web --release --no-pub --base-href / --dart-define BASE_URL=/api/

      - name: Build Android production APK
        if: matrix.platform == 'android'
        run: flutter build apk --release --no-pub --flavor production

      - name: Smoke-build Android dev APK
        if: matrix.platform == 'android'
        run: flutter build apk --debug --no-pub --flavor dev

      - name: Build iOS production without signing
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign --no-pub

      - name: Smoke-build iOS dev without signing
        if: matrix.platform == 'ios'
        run: flutter build ios --debug --no-codesign --no-pub --flavor dev

      - name: Build macOS without signing
        if: matrix.platform == 'macos'
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
        run: flutter build macos --release --no-pub
