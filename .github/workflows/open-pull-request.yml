name: Open pull request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-pull-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Open pull request into main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const head = context.ref.replace('refs/heads/', '');

            const findOpenPullRequest = async () => {
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 1,
              });

              return pullRequests[0];
            };

            const existingPullRequest = await findOpenPullRequest();
            if (existingPullRequest) {
              core.info(
                `Pull request #${existingPullRequest.number} already targets ${base}.`,
              );
              return;
            }

            const { data: comparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${head}`,
              });

            if (comparison.ahead_by === 0) {
              core.info(`${head} has no commits to merge into ${base}.`);
              return;
            }

            try {
              const { data: pullRequest } = await github.rest.pulls.create({
                owner,
                repo,
                title: `Merge ${head} into ${base}`,
                head,
                base,
                body: 'Automatically created after the source branch was pushed.',
              });

              core.info(`Created pull request #${pullRequest.number}.`);
            } catch (error) {
              const concurrentlyCreatedPullRequest = await findOpenPullRequest();
              if (concurrentlyCreatedPullRequest) {
                core.info(
                  `Pull request #${concurrentlyCreatedPullRequest.number} was created concurrently.`,
                );
                return;
              }

              throw error;
            }
