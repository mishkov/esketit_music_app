name: Open pull request

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: open-pull-request-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request automation token
        env:
          PULL_REQUEST_AUTOMATION_TOKEN: ${{ secrets.PULL_REQUEST_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$PULL_REQUEST_AUTOMATION_TOKEN" ]]; then
            echo "::error::Add the PULL_REQUEST_AUTOMATION_TOKEN repository secret."
            exit 1
          fi

      - name: Open pull request into main
        id: open-pull-request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PULL_REQUEST_AUTOMATION_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';
            const head = context.ref.replace('refs/heads/', '');

            const findOpenPullRequest = async () => {
              const { data: pullRequests } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${head}`,
                base,
                per_page: 1,
              });

              return pullRequests[0];
            };

            const existingPullRequest = await findOpenPullRequest();
            if (existingPullRequest) {
              core.info(
                `Pull request #${existingPullRequest.number} already targets ${base}.`,
              );
              core.setOutput('number', existingPullRequest.number);
              return;
            }

            const { data: comparison } =
              await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${head}`,
              });

            if (comparison.ahead_by === 0) {
              core.info(`${head} has no commits to merge into ${base}.`);
              return;
            }

            try {
              const { data: pullRequest } = await github.rest.pulls.create({
                owner,
                repo,
                title: `Merge ${head} into ${base}`,
                head,
                base,
                body: 'Automatically created after the source branch was pushed.',
              });

              core.info(`Created pull request #${pullRequest.number}.`);
              core.setOutput('number', pullRequest.number);
            } catch (error) {
              const concurrentlyCreatedPullRequest = await findOpenPullRequest();
              if (concurrentlyCreatedPullRequest) {
                core.info(
                  `Pull request #${concurrentlyCreatedPullRequest.number} was created concurrently.`,
                );
                core.setOutput('number', concurrentlyCreatedPullRequest.number);
                return;
              }

              throw error;
            }

      - name: Enable auto-merge
        if: ${{ steps.open-pull-request.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.PULL_REQUEST_AUTOMATION_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ steps.open-pull-request.outputs.number }}
        run: |
          set -euo pipefail

          auto_merge_status="$(
            gh pr view "$PULL_REQUEST_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json autoMergeRequest,state \
              --jq 'if .state != "OPEN" then "closed" elif .autoMergeRequest != null then "enabled" else "disabled" end'
          )"

          if [[ "$auto_merge_status" == "closed" ]]; then
            echo "Pull request #${PULL_REQUEST_NUMBER} is no longer open."
            exit 0
          fi

          if [[ "$auto_merge_status" == "enabled" ]]; then
            echo "Auto-merge is already enabled for pull request #${PULL_REQUEST_NUMBER}."
            exit 0
          fi

          gh pr merge "$PULL_REQUEST_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge
