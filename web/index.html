<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Музыка без цензуры.">
  <meta name="application-name" content="Esketit Music">
  <meta name="theme-color" content="#2EBD70">
  <meta name="robots" content="index, follow">

  <!-- Search engines -->
  <link rel="canonical" href="https://esketitmusic.online/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Esketit Music">
  <meta property="og:title" content="Esketit Music">
  <meta property="og:description" content="Музыка без цензуры.">
  <meta property="og:url" content="https://esketitmusic.online/">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:image" content="https://esketitmusic.online/icons/Icon-512.png">
  <meta property="og:image:secure_url" content="https://esketitmusic.online/icons/Icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Иконка Esketit Music">

  <!-- X (Twitter) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Esketit Music">
  <meta name="twitter:description" content="Музыка без цензуры.">
  <meta name="twitter:image" content="https://esketitmusic.online/icons/Icon-512.png">
  <meta name="twitter:image:alt" content="Иконка Esketit Music">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Esketit Music">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>Esketit Music</title>
  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Esketit Music",
      "alternateName": "Эщкере Музыка",
      "description": "Музыка без цензуры.",
      "url": "https://esketitmusic.online/",
      "image": "https://esketitmusic.online/icons/Icon-512.png",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any",
      "inLanguage": ["ru", "en"]
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
